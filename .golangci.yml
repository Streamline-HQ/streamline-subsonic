version: "2"

issues:
  max-same-issues: 0
  max-issues-per-linter: 0

formatters:
  enable:
    - gofumpt
    - golines

  exclusions:
    generated: lax

  settings:
    golines:
      max-len: 85

linters:
  default: standard

  enable:
    - unparam
    - unconvert
    - modernize
    - prealloc
    - ginkgolinter
    - errorlint
    - bodyclose
    - gosec
    - nolintlint

  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
    unparam:
      check-exported: true

  exclusions:
    generated: lax
    rules:
      - linters:
          - gosec
        path: (_test\.go$|^e2e/)
        text: "G(101|104|115|124|202|204|702|301|302|304|306|404)"
      - linters:
          - errcheck
        source: .*\.Close\(\)
